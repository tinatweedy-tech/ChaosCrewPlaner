<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChaosCrewPlaner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #FFF8F2;
            color: #4a3728;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #8B5E3C, #A0522D);
            padding: 14px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(139,94,60,0.3);
        }

        .header h1 {
            font-size: 1.3em;
            color: #FFE4B5;
        }

        .header .subtitle {
            font-size: 0.75em;
            color: rgba(255,228,181,0.7);
            margin-top: 2px;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-left: 6px;
            vertical-align: middle;
        }

        .status-online { background: #66BB6A; }
        .status-offline { background: #ef5350; }

        /* ===== TABS - Lachsfarben ===== */
        .tabs {
            display: flex;
            background: linear-gradient(135deg, #E8967D, #D4836B);
            position: sticky;
            top: 62px;
            z-index: 99;
            box-shadow: 0 2px 8px rgba(210,120,90,0.25);
        }

        .tab {
            flex: 1;
            padding: 13px 4px;
            text-align: center;
            font-size: 0.95em;
            font-weight: 700;
            color: rgba(255,255,255,0.55);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #fff;
            border-bottom-color: #fff;
        }

        /* ===== WEEK NAV ===== */
        .week-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: #f5e8da;
            border-bottom: 1px solid #e8d5c4;
        }

        .week-nav button {
            background: #A0522D;
            border: none;
            color: #FFE4B5;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: 700;
        }

        .week-nav button:active {
            background: #8B4513;
            transform: scale(0.95);
        }

        .week-label {
            font-size: 1.15em;
            font-weight: 800;
            color: #5D3A1A;
            text-align: center;
        }

        /* ===== VIEWS ===== */
        .view {
            display: none;
            padding-bottom: 20px;
        }

        .view.active {
            display: block;
        }

        /* ===== DAY CARD ===== */
        .day-card {
            background: #fff;
            margin: 10px 12px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(139,94,60,0.08);
            border: 1px solid #ede3d7;
        }

        .day-card.today {
            border: 2px solid #D2691E;
            box-shadow: 0 4px 18px rgba(210,105,30,0.15);
        }

        .day-header {
            background: linear-gradient(135deg, #DCC7B0, #D4BDA6);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-header.today-header {
            background: linear-gradient(135deg, #D2691E, #CD853F);
        }

        .day-name {
            font-size: 1.1em;
            font-weight: 800;
            color: #3E2723;
        }

        .day-date {
            font-size: 0.8em;
            color: rgba(62,39,35,0.6);
            font-weight: 600;
        }

        .day-badge {
            background: rgba(255,255,255,0.45);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.72em;
            font-weight: 700;
            color: #3E2723;
        }

        .day-body {
            padding: 12px 16px;
        }

        /* ===== KID ROWS ===== */
        .kid-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid #f5efe8;
        }

        .kid-row:last-child {
            border-bottom: none;
        }

        .kid-name {
            font-size: 1em;
            font-weight: 700;
            min-width: 100px;
        }

        .name-oskar { color: #1565C0; }
        .name-henri { color: #7B1FA2; }
        .name-enni { color: #C62828; }

        /* ===== BLOCK BUTTONS ===== */
        .block-buttons {
            display: flex;
            gap: 6px;
        }

        .block-btn {
            padding: 10px 16px;
            border-radius: 12px;
            border: 2px solid #ddd0c2;
            background: #FFF8F2;
            color: #b0a090;
            font-size: 0.95em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 48px;
            text-align: center;
        }

        .block-btn:active {
            transform: scale(0.93);
        }

        .block-btn.selected-none {
            background: #f0e8df;
            border-color: #c9b99a;
            color: #8a7a6a;
        }

        .block-btn.selected-3 {
            background: #E8F5E9;
            border-color: #66BB6A;
            color: #2E7D32;
            box-shadow: 0 0 8px rgba(102,187,106,0.25);
        }

        .block-btn.selected-4 {
            background: #FFF3E0;
            border-color: #FFA726;
            color: #E65100;
            box-shadow: 0 0 8px rgba(255,167,38,0.25);
        }

        /* ===== SECTIONS ===== */
        .section-divider {
            border: none;
            border-top: 1px solid #f0e8df;
            margin: 10px 0;
        }

        .section-label {
            font-size: 0.75em;
            color: #a09080;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px 0 6px 0;
            font-weight: 700;
        }

        /* ===== RESULT BOX ===== */
        .result-box {
            background: #faf6f0;
            border-radius: 12px;
            padding: 10px 14px;
            margin: 5px 0;
            border: 1px solid #ede3d7;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
        }

        .result-label {
            font-size: 0.85em;
            color: #8a7a6a;
            font-weight: 600;
        }

        .result-value {
            font-size: 0.95em;
            font-weight: 700;
        }

        .train-green { color: #2E7D32; }
        .train-orange { color: #E65100; }

        /* ===== ABHOL BUTTON ===== */
        .abhol-btn {
            padding: 9px 18px;
            border-radius: 12px;
            border: 2px solid transparent;
            font-size: 0.9em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 90px;
        }

        .abhol-btn:active {
            transform: scale(0.95);
        }

        .abhol-tina {
            background: #E8F5E9;
            color: #2E7D32;
            border-color: #66BB6A;
        }

        .abhol-jan {
            background: #FFF3E0;
            color: #E65100;
            border-color: #FFA726;
        }

        /* ===== RIKJE TOGGLE ===== */
        .rikje-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
        }

        .toggle-switch {
            position: relative;
            width: 52px;
            height: 30px;
            background: #66BB6A;
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.late {
            background: #FFA726;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: transform 0.3s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }

        .toggle-switch.late::after {
            transform: translateX(22px);
        }

        .toggle-label {
            font-size: 0.85em;
            font-weight: 600;
            color: #5D3A1A;
        }

        /* ===== DAY OFF ===== */
        .day-off-btn {
            padding: 7px 14px;
            border-radius: 10px;
            border: 1px solid #ddd0c2;
            background: transparent;
            color: #a09080;
            font-size: 0.75em;
            cursor: pointer;
            font-weight: 600;
        }

        .day-off-btn.active {
            background: #FFCCBC;
            border-color: #FF7043;
            color: #BF360C;
        }

        /* ===== OVERVIEW ===== */
        .overview-card {
            background: #fff;
            margin: 10px 12px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #ede3d7;
            box-shadow: 0 2px 10px rgba(139,94,60,0.08);
        }

        .overview-day {
            padding: 14px 16px;
            border-bottom: 1px solid #f0e8df;
            cursor: pointer;
        }

        .overview-day:active {
            background: #faf6f0;
        }

        .overview-day:last-child {
            border-bottom: none;
        }

        .overview-day.today-overview {
            border-left: 4px solid #D2691E;
            background: #FFF5EE;
        }

        .overview-day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .overview-day-name {
            font-weight: 800;
            font-size: 1.1em;
            color: #3E2723;
        }

        .overview-details {
            font-size: 0.9em;
            color: #6d5a4a;
            line-height: 1.8;
        }

        .overview-chip {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: 700;
            margin: 2px 3px;
        }

        .chip-green {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .chip-orange {
            background: #FFF3E0;
            color: #E65100;
        }

        .chip-off {
            background: #f5efe8;
            color: #a09080;
        }

        .overview-rikje {
            margin-top: 4px;
            font-size: 0.9em;
            font-weight: 600;
            color: #6d5a4a;
        }

        /* ===== BOXES ===== */
        .warning-box {
            background: #FFF3E0;
            border: 1px solid #FFE0B2;
            border-radius: 12px;
            padding: 10px 14px;
            margin: 6px 0;
            font-size: 0.85em;
            color: #E65100;
            font-weight: 600;
        }

        .info-box {
            background: #E8F5E9;
            border: 1px solid #C8E6C9;
            border-radius: 12px;
            padding: 10px 14px;
            margin: 6px 0;
            font-size: 0.85em;
            color: #2E7D32;
            font-weight: 600;
        }

        /* ===== LEGEND ===== */
        .legend {
            margin: 12px 12px;
            padding: 14px 16px;
            background: #fff;
            border-radius: 14px;
            font-size: 0.8em;
            color: #8a7a6a;
            line-height: 2;
            border: 1px solid #ede3d7;
        }

        .legend-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #5D3A1A;
            color: #FFE4B5;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.85em;
            z-index: 1000;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 20px rgba(93,58,26,0.3);
            text-align: center;
            max-width: 90%;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 40px;
            color: #a09080;
        }

        .loading .spinner {
            border: 3px solid #ede3d7;
            border-top: 3px solid #A0522D;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-box {
            background: #FFEBEE;
            border: 1px solid #FFCDD2;
            border-radius: 12px;
            padding: 14px 16px;
            margin: 20px 12px;
            font-size: 0.85em;
            color: #C62828;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚂 ChaosCrewPlaner <span class="status-dot status-offline" id="statusDot"></span></h1>
        <div class="subtitle">Oskar • Henri • Enni • Rikje — Tina & Jan</div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchView('days')" id="tabDays">📅 Tage</div>
        <div class="tab" onclick="switchView('overview')" id="tabOverview">📋 Woche</div>
    </div>

    <div class="week-nav">
        <button onclick="changeWeek(-1)">◀</button>
        <span class="week-label" id="weekLabel">KW --</span>
        <button onclick="changeWeek(1)">▶</button>
    </div>

    <div class="view active" id="viewDays">
        <div class="loading" id="loadingDays">
            <div class="spinner"></div>
            Verbinde...
        </div>
        <div id="daysContainer"></div>
    </div>

    <div class="view" id="viewOverview">
        <div id="overviewContainer"></div>
    </div>

    <div class="legend">
        <span class="legend-dot" style="background:#66BB6A"></span> <strong>3 Blöcke</strong> → Velgast 15:41<br>
        <span class="legend-dot" style="background:#FFA726"></span> <strong>4 Blöcke</strong> → Buchenhorst 16:36<br>
        🏡 Rikje wird auf dem Weg abgeholt<br>
        Voreinstellung: 👩 Tina = früh · 👨 Jan = spät
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        try {
            firebase.initializeApp({
                apiKey: "AIzaSyAzi-3Vdj23GcrWTsIweGKy9VbfDeZQA1U",
                authDomain: "familienplaner-9046e.firebaseapp.com",
                databaseURL: "https://familienplaner-9046e-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "familienplaner-9046e",
                storageBucket: "familienplaner-9046e.firebasestorage.app",
                messagingSenderId: "133115165357",
                appId: "1:133115165357:web:8b3bc717611fa7dcb46424"
            });
        } catch(e) {
            document.getElementById('loadingDays').innerHTML = '<div class="error-box">Firebase Fehler: ' + e.message + '</div>';
        }

        var db = firebase.database();
        var KIDS = ['Oskar', 'Henri', 'Enni'];
        var DAYS_DE = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag'];
        var DAYS_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr'];
        var KID_EMOJIS = { Oskar: '👦🏼', Henri: '🧒🏼', Enni: '👧🏼', Rikje: '👶🏼' };
        var KID_CLASSES = { Oskar: 'name-oskar', Henri: 'name-henri', Enni: 'name-enni' };
        var currentWeekOffset = 0;
        var weekData = {};
        var currentListener = null;
        var isFirstLoad = true;

        function getMonday(offset) {
            var now = new Date();
            var day = now.getDay();
            var diff = now.getDate() - day + (day === 0 ? -6 : 1);
            var monday = new Date(now);
            monday.setDate(diff + (offset || 0) * 7);
            monday.setHours(0, 0, 0, 0);
            return monday;
        }

        function getISOWeek(date) {
            var d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
        }

        function getWeekKey(offset) {
            var mon = getMonday(offset);
            return mon.getFullYear() + '-W' + String(getISOWeek(mon)).padStart(2, '0');
        }

        function getWeekDates(offset) {
            var mon = getMonday(offset);
            var dates = [];
            for (var i = 0; i < 5; i++) {
                var d = new Date(mon);
                d.setDate(mon.getDate() + i);
                dates.push(d);
            }
            return dates;
        }

        function formatDate(d) {
            return d.getDate() + '.' + (d.getMonth() + 1) + '.';
        }

        function isToday(d) {
            var now = new Date();
            return d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        }

        function createDefaultDay() {
            return { oskar: '-', henri: '-', enni: '-', abholFrueh: 'Tina', abholSpaet: 'Jan', rikjeRoute: 'frueh', dayOff: false };
        }

        function createDefaultWeek() {
            var week = {};
            for (var i = 0; i < 5; i++) week['day' + i] = createDefaultDay();
            return week;
        }

        function listenToWeek() {
            if (currentListener) currentListener.off();
            var key = getWeekKey(currentWeekOffset);
            var ref = db.ref('weeks/' + key);
            currentListener = ref;
            isFirstLoad = true;
            document.getElementById('loadingDays').style.display = 'block';
            document.getElementById('daysContainer').innerHTML = '';

            ref.on('value', function(snapshot) {
                document.getElementById('loadingDays').style.display = 'none';
                if (snapshot.exists()) {
                    weekData = snapshot.val();
                    for (var i = 0; i < 5; i++) {
                        if (!weekData['day' + i]) weekData['day' + i] = createDefaultDay();
                    }
                } else {
                    weekData = createDefaultWeek();
                    ref.set(weekData);
                }
                renderAll();
            }, function(error) {
                document.getElementById('loadingDays').innerHTML = '<div class="error-box">Fehler: ' + error.message + '</div>';
            });
        }

        function updateDay(dayIndex, field, value) {
            var key = getWeekKey(currentWeekOffset);
            db.ref('weeks/' + key + '/day' + dayIndex + '/' + field).set(value);
        }

        db.ref('.info/connected').on('value', function(snap) {
            document.getElementById('statusDot').className = snap.val() === true ? 'status-dot status-online' : 'status-dot status-offline';
        });

        function switchView(view) {
            document.getElementById('viewDays').className = view === 'days' ? 'view active' : 'view';
            document.getElementById('viewOverview').className = view === 'overview' ? 'view active' : 'view';
            document.getElementById('tabDays').className = view === 'days' ? 'tab active' : 'tab';
            document.getElementById('tabOverview').className = view === 'overview' ? 'tab active' : 'tab';
            if (view === 'overview') renderOverview();
        }

        function changeWeek(dir) {
            currentWeekOffset += dir;
            updateWeekLabel();
            listenToWeek();
        }

        function updateWeekLabel() {
            var mon = getMonday(currentWeekOffset);
            var fri = new Date(mon);
            fri.setDate(mon.getDate() + 4);
            document.getElementById('weekLabel').textContent = 'KW ' + getISOWeek(mon) + ' · ' + formatDate(mon) + ' – ' + formatDate(fri);
        }

        function renderAll() {
            var scrollY = window.scrollY;
            renderDays();
            renderOverview();
            if (isFirstLoad) {
                isFirstLoad = false;
                setTimeout(function() {
                    var el = document.querySelector('.day-card.today');
                    if (el && currentWeekOffset === 0) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 200);
            } else {
                window.scrollTo(0, scrollY);
            }
        }

        function renderDays() {
            var container = document.getElementById('daysContainer');
            var dates = getWeekDates(currentWeekOffset);
            var html = '';
            for (var i = 0; i < 5; i++) {
                var d = dates[i];
                var day = weekData['day' + i] || createDefaultDay();
                var today = isToday(d);
                html += day.dayOff ? renderDayOff(i, d, today) : renderDayCard(i, d, today, day);
            }
            container.innerHTML = html;
        }

        function renderDayCard(i, date, today, day) {
            var kids3 = [], kids4 = [];
            KIDS.forEach(function(k) {
                if (day[k.toLowerCase()] === '3') kids3.push(k);
                if (day[k.toLowerCase()] === '4') kids4.push(k);
            });
            var hasEarly = kids3.length > 0, hasLate = kids4.length > 0;
            var rikjeRoute = day.rikjeRoute || 'frueh';
            var rikjeText = '', rikjeClass = '';
            if (hasEarly && hasLate) {
                if (rikjeRoute === 'frueh') { rikjeText = '👶🏼 Rikje → mit ' + day.abholFrueh + ' (Velgast)'; rikjeClass = 'info-box'; }
                else { rikjeText = '👶🏼 Rikje → mit ' + day.abholSpaet + ' (Buchenhorst)'; rikjeClass = 'warning-box'; }
            } else if (hasEarly) { rikjeText = '👶🏼 Rikje → mit ' + day.abholFrueh + ' (Velgast)'; rikjeClass = 'info-box'; }
            else if (hasLate) { rikjeText = '👶🏼 Rikje → mit ' + day.abholSpaet + ' (Buchenhorst)'; rikjeClass = 'warning-box'; }

            var kidRows = '';
            KIDS.forEach(function(kid) {
                var val = day[kid.toLowerCase()] || '-';
                kidRows += '<div class="kid-row"><span class="kid-name ' + KID_CLASSES[kid] + '">' + KID_EMOJIS[kid] + ' ' + kid + '</span>' +
                    '<div class="block-buttons">' +
                    '<button class="block-btn ' + (val === '-' ? 'selected-none' : '') + '" onclick="setBlock(' + i + ',\'' + kid.toLowerCase() + '\',\'-\')">—</button>' +
                    '<button class="block-btn ' + (val === '3' ? 'selected-3' : '') + '" onclick="setBlock(' + i + ',\'' + kid.toLowerCase() + '\',\'3\')">3</button>' +
                    '<button class="block-btn ' + (val === '4' ? 'selected-4' : '') + '" onclick="setBlock(' + i + ',\'' + kid.toLowerCase() + '\',\'4\')">4</button>' +
                    '</div></div>';
            });

            var earlyBox = '';
            if (hasEarly) {
                var ee = ''; kids3.forEach(function(k) { ee += KID_EMOJIS[k] + ' '; });
                earlyBox = '<div class="result-box"><div class="result-row"><span class="result-label">🟢 Velgast 15:41</span><span class="result-value train-green">' + ee + '</span></div>' +
                    '<div class="result-row"><span class="result-label">Abholen:</span>' +
                    '<button class="abhol-btn ' + (day.abholFrueh === 'Tina' ? 'abhol-tina' : 'abhol-jan') + '" onclick="toggleAbhol(' + i + ',\'frueh\')">' +
                    (day.abholFrueh === 'Tina' ? '👩 Tina' : '👨 Jan') + '</button></div></div>';
            }
            var lateBox = '';
            if (hasLate) {
                var le = ''; kids4.forEach(function(k) { le += KID_EMOJIS[k] + ' '; });
                lateBox = '<div class="result-box" style="margin-top:6px;"><div class="result-row"><span class="result-label">🟠 Buchenhorst 16:36</span><span class="result-value train-orange">' + le + '</span></div>' +
                    '<div class="result-row"><span class="result-label">Abholen:</span>' +
                    '<button class="abhol-btn ' + (day.abholSpaet === 'Tina' ? 'abhol-tina' : 'abhol-jan') + '" onclick="toggleAbhol(' + i + ',\'spaet\')">' +
                    (day.abholSpaet === 'Tina' ? '👩 Tina' : '👨 Jan') + '</button></div></div>';
            }
            var rikjeSection = '';
            if (hasEarly || hasLate) {
                rikjeSection = '<hr class="section-divider"><div class="section-label">🏡 Rikje (Kita)</div><div class="' + rikjeClass + '">' + rikjeText + '</div>';
                if (hasEarly && hasLate) {
                    rikjeSection += '<div class="rikje-toggle"><span class="toggle-label">' + (rikjeRoute === 'frueh' ? '🟢 Velgast-Route' : '🟠 Buchenhorst-Route') + '</span>' +
                        '<div class="toggle-switch ' + (rikjeRoute === 'spaet' ? 'late' : '') + '" onclick="toggleRikje(' + i + ')"></div></div>';
                }
            }
            var warn = (!hasEarly && !hasLate) ? '<div class="warning-box">⚠️ Noch keine Blöcke eingetragen</div>' : '';

            return '<div class="day-card ' + (today ? 'today' : '') + '" id="day-' + i + '"><div class="day-header ' + (today ? 'today-header' : '') + '">' +
                '<div><div class="day-name">' + DAYS_DE[i] + '</div><div class="day-date">' + formatDate(date) + '</div></div>' +
                '<div style="display:flex;gap:6px;align-items:center;">' + (today ? '<span class="day-badge">HEUTE</span>' : '') +
                '<button class="day-off-btn" onclick="toggleDayOff(' + i + ')">🏖️ Frei</button></div></div>' +
                '<div class="day-body"><div class="section-label">🎒 Blöcke</div>' + kidRows +
                '<hr class="section-divider"><div class="section-label">🚂 Abholung</div>' +
                earlyBox + lateBox + rikjeSection + warn + '</div></div>';
        }

        function renderDayOff(i, date, today) {
            return '<div class="day-card ' + (today ? 'today' : '') + '" id="day-' + i + '"><div class="day-header ' + (today ? 'today-header' : '') + '">' +
                '<div><div class="day-name">' + DAYS_DE[i] + '</div><div class="day-date">' + formatDate(date) + '</div></div>' +
                '<button class="day-off-btn active" onclick="toggleDayOff(' + i + ')">🏖️ Frei</button></div>' +
                '<div class="day-body" style="text-align:center;padding:24px;color:#a09080;"><div style="font-size:2em;margin-bottom:8px;">🏖️</div>Frei / Ferien</div></div>';
        }

        function renderOverview() {
            var container = document.getElementById('overviewContainer');
            var dates = getWeekDates(currentWeekOffset);
            var html = '<div class="overview-card">';
            for (var i = 0; i < 5; i++) {
                var d = dates[i], day = weekData['day' + i] || createDefaultDay(), today = isToday(d);
                if (day.dayOff) {
                    html += '<div class="overview-day ' + (today ? 'today-overview' : '') + '" onclick="goToDay(' + i + ')"><div class="overview-day-header"><span class="overview-day-name">' + DAYS_SHORT[i] + ' ' + formatDate(d) + (today ? ' 📍' : '') + '</span><span class="overview-chip chip-off">🏖️ Frei</span></div></div>';
                    continue;
                }
                var kids3 = [], kids4 = [];
                KIDS.forEach(function(k) { if (day[k.toLowerCase()] === '3') kids3.push(k); if (day[k.toLowerCase()] === '4') kids4.push(k); });
                var rikjeRoute = day.rikjeRoute || 'frueh';
                var rikjeParent = '';
                if (kids3.length > 0 && (rikjeRoute === 'frueh' || kids4.length === 0)) rikjeParent = day.abholFrueh;
                else if (kids4.length > 0) rikjeParent = day.abholSpaet;
                var details = '';
                if (kids3.length > 0) details += '<span class="overview-chip chip-green">🟢 ' + kids3.join(', ') + ' → ' + day.abholFrueh + ' 15:41</span> ';
                if (kids4.length > 0) details += '<span class="overview-chip chip-orange">🟠 ' + kids4.join(', ') + ' → ' + day.abholSpaet + ' 16:36</span> ';
                var rikjeLine = rikjeParent ? '<div class="overview-rikje">🏡 Rikje → ' + rikjeParent + '</div>' : '';
                if (!kids3.length && !kids4.length) details += '<span style="color:#bbb;">— Noch offen —</span>';
                html += '<div class="overview-day ' + (today ? 'today-overview' : '') + '" onclick="goToDay(' + i + ')"><div class="overview-day-header"><span class="overview-day-name">' + DAYS_SHORT[i] + ' ' + formatDate(d) + (today ? ' 📍' : '') + '</span></div><div class="overview-details">' + details + rikjeLine + '</div></div>';
            }
            html += '</div>';
            container.innerHTML = html;
        }

        function setBlock(di, kid, val) { updateDay(di, kid, val); }
        function toggleAbhol(di, type) {
            var day = weekData['day' + di];
            if (type === 'frueh') { var n = day.abholFrueh === 'Tina' ? 'Jan' : 'Tina'; updateDay(di, 'abholFrueh', n); updateDay(di, 'abholSpaet', n === 'Tina' ? 'Jan' : 'Tina'); }
            else { var n2 = day.abholSpaet === 'Tina' ? 'Jan' : 'Tina'; updateDay(di, 'abholSpaet', n2); updateDay(di, 'abholFrueh', n2 === 'Tina' ? 'Jan' : 'Tina'); }
        }
        function toggleRikje(di) { var day = weekData['day' + di]; updateDay(di, 'rikjeRoute', (day.rikjeRoute || 'frueh') === 'frueh' ? 'spaet' : 'frueh'); }
        function toggleDayOff(di) { updateDay(di, 'dayOff', !weekData['day' + di].dayOff); }
        function goToDay(di) { switchView('days'); setTimeout(function() { var el = document.getElementById('day-' + di); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 200); }
        function showToast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 2500); }

        updateWeekLabel();
        listenToWeek();
    </script>
</body>
</html>
